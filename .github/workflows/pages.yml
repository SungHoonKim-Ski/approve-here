name: pages
# surfaces/web/index.html을 GitHub Pages로 올린다. 데몬 없이 열리면 체험 모드로 동작한다.
on:
  push:
    branches: [main]
    paths: [surfaces/web/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages 소스를 GitHub Actions로 켠다. 저장소 설정을 손으로 만지지 않아도 첫 실행에서 활성화된다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: surfaces/web
      - id: deployment
        uses: actions/deploy-pages@v4
